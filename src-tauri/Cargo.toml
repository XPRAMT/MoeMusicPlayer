[package]
name = "moemusicplayer"
version = "0.1.0"
description = "Local-first music player"
authors = ["MoeMusicPlayer contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "moemusicplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
player-core = { path = "../crates/player-core" }
player-db = { path = "../crates/player-db" }
tauri-plugin-media-index = { path = "../plugins/tauri-plugin-media-index" }
base64 = "0.22"
imagesize = "0.14"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri = { version = "2.12.0", features = [] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
player-audio-windows = { path = "../crates/player-audio-windows" }
player-platform-windows = { path = "../crates/player-platform-windows" }
tauri-plugin-dialog = "=2.8.0"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_os = "android")'.dependencies.lofty]
version = "0.25.4"
