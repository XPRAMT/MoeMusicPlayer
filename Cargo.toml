[workspace]
members = [
    "src-tauri",
    "crates/player-core",
    "crates/player-dsd",
    "crates/player-formats",
    "crates/player-fonts",
    "crates/player-opus",
    "crates/player-wavpack",
    "crates/player-remote",
    "crates/player-track-metadata",
    "crates/player-db",
    "crates/player-zh",
    "crates/player-lyrics-rules",
    "crates/player-lyrics-native",
    "crates/player-platform-windows",
    "crates/player-audio-windows",
    "crates/player-tags",
    "plugins/tauri-plugin-media-index",
]
default-members = ["src-tauri"]
resolver = "2"

[patch.crates-io]
# Upstream smb-rs 0.12.1 is NDR64-only for SRVSVC share enumeration. Keep this narrow local fork
# until upstream adds NDR32 marshalling and transfer-syntax negotiation (see vendor/smb-rs/UPSTREAM.md).
smb = { path = "vendor/smb-rs/smb" }
smb-rpc = { path = "vendor/smb-rs/smb-rpc" }

# The Android APK is a dev-profile build: without this its native library carries ~380 MB of Rust debug info.
[profile.dev]
debug = false

# Heavy DSP/decoder deps (symphonia, rustfft, png, lofty) are 10-30x slower unoptimized; the
# Android APK is a debug build, so optimize dependencies + player-tags even in the dev profile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.player-tags]
opt-level = 3

