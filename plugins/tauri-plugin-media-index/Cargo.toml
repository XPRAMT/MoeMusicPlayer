[package]
name = "tauri-plugin-media-index"
version = "0.1.0"
description = "Android MediaStore and Storage Access Framework adapter for MoeMusicPlayer"
edition = "2024"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-media-index"

[dependencies]
tauri = { version = "2.12.0" }
player-core = { path = "../../crates/player-core" }
player-formats = { path = "../../crates/player-formats" }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
lofty = "0.25.4"

[target.'cfg(target_os = "android")'.dependencies]
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "isomp4"] }

[dev-dependencies]
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "isomp4"] }

[build-dependencies]
tauri-plugin = { version = "2.7.0", features = ["build"] }
