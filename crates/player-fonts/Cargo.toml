[package]
name = "player-fonts"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Installed font discovery for the font pickers (ADR 0042): face names, scripts, region ordering, cache diff"

[dependencies]
serde = { version = "1", features = ["derive"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
# MIT OR Apache-2.0; without `variable-fonts` (no skrifa / write-fonts): CFF2 fonts get no name subset.
subsetter = { version = "0.2.6", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6.1"
windows = { version = "=0.62.2", features = ["Win32_Globalization"] }

[dev-dependencies]
serde_json = "1"
