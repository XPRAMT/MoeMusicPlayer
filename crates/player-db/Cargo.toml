[package]
name = "player-db"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
player-core = { path = "../player-core" }
icu_collator = "=2.3.1"
icu_locale = "=2.3.1"
player-zh = { path = "../player-zh" }
rusqlite = { version = "0.40", features = ["bundled", "collation", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
uuid = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
