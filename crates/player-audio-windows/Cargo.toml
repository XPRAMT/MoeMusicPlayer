[package]
name = "player-audio-windows"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[target.'cfg(windows)'.dependencies]
rodio = { version = "=0.22.2", default-features = false, features = [
    "playback",
    "mp3",
    "mp4",
    "flac",
    "vorbis",
    "wav",
] }
# High-quality sample-rate conversion (MIT OR Apache-2.0).
rubato = { version = "=5.0.1", default-features = false, features = ["fft_resampler"] }
windows = { version = "=0.62.2", features = [
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
