[package]
name = "player-audio-windows"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
player-dsd = { path = "../player-dsd" }
player-formats = { path = "../player-formats" }
player-wavpack = { path = "../player-wavpack" }

[dev-dependencies]
player-dsd = { path = "../player-dsd", features = ["testing"] }
player-opus = { path = "../player-opus", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
player-opus = { path = "../player-opus" }
rodio = { version = "=0.22.2", default-features = false, features = [
    "playback",
    "symphonia-alac",
    "symphonia-mkv",
    "mp3",
    "mp4",
    "flac",
    "vorbis",
    "wav",
] }
# High-quality sample-rate conversion (MIT OR Apache-2.0).
rubato = { version = "=5.0.1", default-features = false, features = ["fft_resampler"] }
symphonia = { version = "=0.5.5", default-features = false, features = [
    "mp3",
    "flac",
    "vorbis",
    "wav",
    "aac",
    "alac",
    "isomp4",
    "mkv",
    "pcm",
] }
# WASAPI exclusive mode (ADR 0020); MIT, built on the same windows crate version.
wasapi = "=0.26.0"
# The `#[implement]` macro (the device notification client) names this crate; same version the `windows` crate uses.
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
