[package]
name = "player-track-metadata"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Tags and audio properties of one track, from a local file or any seekable byte source (ADR 0026)"

[dependencies]
player-core = { path = "../player-core" }
player-formats = { path = "../player-formats" }
player-dsd = { path = "../player-dsd", features = ["id3"] }
player-wavpack = { path = "../player-wavpack" }
lofty = "0.25.4"
matroska = "=0.30.1"
symphonia = { version = "=0.5.5", default-features = false, features = ["mkv"] }
