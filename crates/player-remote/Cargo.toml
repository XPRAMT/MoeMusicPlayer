[package]
name = "player-remote"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Remote music sources (SMB, WebDAV; ADR 0026): our own credential encryption, the remote file trait, a cached range reader and the protocol clients"

[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
