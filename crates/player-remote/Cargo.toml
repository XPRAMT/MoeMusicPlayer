[package]
name = "player-remote"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Remote music sources (SMB, WebDAV; ADR 0026): our own credential encryption, the remote file trait, a cached range reader and the protocol clients"

[features]
# A small WebDAV server over a folder, for tests in other crates.
testing = []

[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
roxmltree = "0.21"
md-5 = "0.10"
sha2 = "0.10"
percent-encoding = "2"
httpdate = "1"
player-core = { path = "../player-core" }
player-formats = { path = "../player-formats" }
player-track-metadata = { path = "../player-track-metadata" }
# SMB 2/3 client, pure Rust, blocking API (ADR 0026).
smb = { version = "0.12.1", default-features = false, features = ["multi_threaded", "sign", "encrypt", "compress"] }

[dev-dependencies]
lofty = "0.25.4"
player-db = { path = "../player-db" }

[[test]]
name = "real_music"
required-features = ["testing"]
