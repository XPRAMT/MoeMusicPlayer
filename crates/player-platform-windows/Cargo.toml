[package]
name = "player-platform-windows"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
player-core = { path = "../player-core" }
player-formats = { path = "../player-formats" }
player-dsd = { path = "../player-dsd", features = ["id3"] }
lofty = "0.25.4"
player-tags = { path = "../player-tags" }
matroska = "=0.30.1"
symphonia = { version = "=0.5.5", default-features = false, features = ["mkv"] }

[target.'cfg(windows)'.dependencies]
# The `#[implement]` macro (COM callback objects) names this crate; same version the `windows` crate uses.
windows-core = "=0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_Services",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
player-db = { path = "../player-db" }
player-dsd = { path = "../player-dsd", features = ["id3", "testing"] }
