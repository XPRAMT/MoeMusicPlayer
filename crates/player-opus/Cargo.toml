[package]
name = "player-opus"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Ogg Opus reading and decoding (ADR 0017): our own Ogg page index and packet reader over libopus"

[features]
# Synthetic Ogg Opus files (written with the `ogg` crate) for tests in other crates.
testing = ["dep:ogg"]

[dependencies]
opus = "0.4.0"
ogg = { version = "0.9.2", optional = true }

[dev-dependencies]
ogg = "0.9.2"
