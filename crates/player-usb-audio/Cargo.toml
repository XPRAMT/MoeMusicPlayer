[package]
name = "player-usb-audio"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "USB Audio Class output over Linux usbfs for the Android USB exclusive output (ADR 0046, ADR 0047): descriptor plan, alt choice, state machine, ring buffer, clock requests, feedback, packet sizing, packing"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# Decoding the FLAC fixtures to float as the Android converter does; the STREAMINFO signature is an MD5 of the raw
# samples: the bit-exact check of the packing.
player-flac = { path = "../player-flac" }
md-5 = "0.10.6"
serde_json = "1"
