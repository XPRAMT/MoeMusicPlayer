[package]
name = "player-tags"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Single-track tag read/write and spectrogram rendering (ADR 0013)"

[dependencies]
player-formats = { path = "../player-formats" }
lofty = "0.25.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
realfft = "3"
symphonia = { version = "=0.5.5", default-features = false, features = [
    "mp3",
    "flac",
    "vorbis",
    "wav",
    "aac",
    "alac",
    "isomp4",
    "mkv",
    "pcm",
] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lofty = "0.25.4"
serde_json = "1"
